<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recycle Bin Bingo</title>
<style>
  :root {
    --bg: #0e1014;
    --cell: #1b1f27;
    --cell-hover: #242a35;
    --border: #2b313d;
    --text: #e9ebf1;
    --muted: #8c93a3;
    --accent: #ff3b3b;
    --dab: rgba(255, 59, 59, 0.82);
    --win: #ffcf33;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
  }
  header { text-align: center; margin-bottom: 14px; }
  h1 { margin: 0; font-size: clamp(22px, 5vw, 34px); letter-spacing: 0.01em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 14px; margin-top: 4px; }

  .board { width: min(100%, 660px); }
  .letters, .grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
  .letters div {
    text-align: center; font-weight: 900; color: var(--accent);
    font-size: clamp(20px, 6vw, 36px); padding: 2px 0 6px;
  }

  .cell {
    aspect-ratio: 1;
    position: relative;
    display: flex; align-items: center; justify-content: center;
    padding: 6px;
    background: var(--cell);
    border: 2px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font: inherit;
    font-size: clamp(12px, 3.3vw, 20px);
    font-weight: 600;
    line-height: 1.15;
    text-align: center;
    overflow-wrap: normal;
    hyphens: manual;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.12s, border-color 0.12s, transform 0.08s;
  }
  .cell:hover { background: var(--cell-hover); }
  .cell:active { transform: scale(0.96); }
  .cell:focus-visible { outline: 3px solid var(--win); outline-offset: 2px; }
  .cell .label { position: relative; z-index: 1; display: block; width: 100%; }

  /* The "dab" */
  .cell::after {
    content: "";
    position: absolute;
    inset: 12%;
    border-radius: 50%;
    background: var(--dab);
    transform: scale(0);
    transition: transform 0.15s ease-out;
    z-index: 0;
  }
  .cell.marked::after { transform: scale(1); }
  .cell.marked .label { color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.6); }

  .cell.free { cursor: default; font-weight: 900; font-size: clamp(14px, 4vw, 24px); }
  .cell.free:active { transform: none; }

  .cell.win { border-color: var(--win); box-shadow: 0 0 0 1px var(--win), 0 0 14px rgba(255, 207, 51, 0.35); }

  .status {
    margin: 14px 0 10px; min-height: 28px;
    text-align: center; color: var(--muted); font-size: 15px;
  }
  .status strong { color: var(--win); font-size: 20px; letter-spacing: 0.04em; }

  .controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .controls button {
    font: inherit; font-size: 15px; font-weight: 600;
    padding: 10px 18px; border-radius: 999px; cursor: pointer;
    border: 2px solid var(--border); background: var(--cell); color: var(--text);
  }
  .controls button:hover { background: var(--cell-hover); }
  .controls button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .controls button.primary:hover { filter: brightness(1.1); }

  .banner {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    pointer-events: none; z-index: 10;
  }
  .banner div {
    font-size: clamp(56px, 16vw, 140px); font-weight: 900; color: var(--win);
    text-shadow: 0 4px 0 #b3001b, 0 8px 30px rgba(0,0,0,0.6);
    animation: pop 1.6s ease-out forwards;
  }
  @keyframes pop {
    0% { transform: scale(0.3) rotate(-8deg); opacity: 0; }
    20% { transform: scale(1.1) rotate(3deg); opacity: 1; }
    35% { transform: scale(1) rotate(0); }
    80% { opacity: 1; }
    100% { transform: scale(1.05); opacity: 0; }
  }

  .error { color: var(--accent); text-align: center; max-width: 480px; }

  .picker {
    width: min(100%, 660px);
    margin-bottom: 18px;
    padding: 14px 16px;
    background: var(--cell);
    border: 2px solid var(--border);
    border-radius: 14px;
    text-align: center;
  }
  .picker[hidden] { display: none; }
  .picker-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
  .picker-term {
    margin: 6px 0 2px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: clamp(20px, 5.5vw, 30px);
    font-weight: 700;
    overflow-wrap: anywhere;
    min-height: 1.3em;
  }
  .picker-format { color: var(--muted); font-size: 13px; min-height: 1.2em; }
  .picker-format code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--text); }
  .picker .controls { margin-top: 12px; }

  @media (max-width: 480px) {
    .letters, .grid { gap: 4px; }
    .cell { padding: 2px; border-width: 1px; border-radius: 8px; letter-spacing: -0.02em; }
    .cell.win { border-width: 2px; }
  }
</style>
</head>
<body>
  <header>
    <h1>Recycle <span>Bin</span> Bingo</h1>
    <div class="sub">Tap a square when you spot it. Middle square is free.</div>
  </header>

  <section class="picker" id="picker" hidden aria-live="polite">
    <div class="picker-label">Random item</div>
    <div class="picker-term" id="pickerTerm"></div>
    <div class="picker-format" id="pickerFormat"></div>
    <div class="controls">
      <button class="primary" id="newItem">New random item</button>
      <button id="copyItem">Copy</button>
    </div>
  </section>

  <main class="board">
    <div class="letters"><div>B</div><div>I</div><div>N</div><div>G</div><div>O</div></div>
    <div class="grid" id="grid" role="grid" aria-label="Bingo card"></div>
    <div class="status" id="status" aria-live="polite"></div>
    <div class="controls">
      <button class="primary" id="newCard">New card</button>
      <button id="clearMarks">Clear marks</button>
    </div>
  </main>

<script>
  const STORAGE_KEY = "recycle-bin-bingo-v1";
  const FREE = 12; // center index of a 5x5 grid

  const LINES = [];
  for (let r = 0; r < 5; r++) LINES.push([0, 1, 2, 3, 4].map(c => r * 5 + c));
  for (let c = 0; c < 5; c++) LINES.push([0, 1, 2, 3, 4].map(r => r * 5 + c));
  LINES.push([0, 6, 12, 18, 24], [4, 8, 12, 16, 20]);

  const gridEl = document.getElementById("grid");
  const statusEl = document.getElementById("status");
  let categories = [];
  let state = null; // { cells: string[25] (cells[12] = null), marked: bool[25] }

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  function loadSaved() {
    try {
      const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (s && Array.isArray(s.cells) && s.cells.length === 25 && Array.isArray(s.marked)) return s;
    } catch (e) {}
    return null;
  }

  function newCard() {
    const picks = shuffle([...categories]).slice(0, 24);
    const cells = [...picks.slice(0, 12), null, ...picks.slice(12)];
    const marked = Array(25).fill(false);
    marked[FREE] = true;
    state = { cells, marked };
    save();
    render();
  }

  function winningLines() {
    return LINES.filter(line => line.every(i => state.marked[i]));
  }

  function render() {
    const wins = winningLines();
    const winCells = new Set(wins.flat());
    gridEl.innerHTML = "";
    state.cells.forEach((text, i) => {
      const btn = document.createElement("button");
      btn.className = "cell";
      btn.setAttribute("role", "gridcell");
      const label = document.createElement("span");
      label.className = "label";
      if (i === FREE) {
        btn.classList.add("free");
        label.textContent = "FREE";
        btn.setAttribute("aria-label", "Free space");
      } else {
        label.textContent = text;
        btn.setAttribute("aria-pressed", String(state.marked[i]));
        btn.addEventListener("click", () => toggle(i));
      }
      if (state.marked[i]) btn.classList.add("marked");
      if (winCells.has(i)) btn.classList.add("win");
      btn.appendChild(label);
      gridEl.appendChild(btn);
    });

    const count = state.marked.filter(Boolean).length - 1; // don't count FREE
    if (state.marked.every(Boolean)) {
      statusEl.innerHTML = "<strong>BLACKOUT!</strong> Every square found.";
    } else if (wins.length) {
      statusEl.innerHTML = `<strong>BINGO${wins.length > 1 ? " ×" + wins.length : "!"}</strong> · ${count} of 24 marked`;
    } else {
      statusEl.textContent = `${count} of 24 marked`;
    }
    fitText();
  }

  // Use the big font everywhere, and shrink only the squares whose words don't fit.
  function fitText() {
    gridEl.querySelectorAll(".cell:not(.free) .label").forEach(label => {
      const cell = label.parentElement;
      label.style.fontSize = "";
      let size = parseFloat(getComputedStyle(label).fontSize);
      while (size > 8 && (label.scrollWidth > label.clientWidth || cell.scrollHeight > cell.clientHeight)) {
        size -= 0.5;
        label.style.fontSize = size + "px";
      }
    });
  }

  let fitQueued = false;
  window.addEventListener("resize", () => {
    if (fitQueued || !state) return;
    fitQueued = true;
    requestAnimationFrame(() => { fitQueued = false; fitText(); });
  });

  function toggle(i) {
    const before = winningLines().length;
    state.marked[i] = !state.marked[i];
    save();
    render();
    if (winningLines().length > before) celebrate(state.marked.every(Boolean) ? "BLACKOUT!" : "BINGO!");
  }

  function celebrate(text) {
    const wrap = document.createElement("div");
    wrap.className = "banner";
    const inner = document.createElement("div");
    inner.textContent = text;
    wrap.appendChild(inner);
    document.body.appendChild(wrap);
    setTimeout(() => wrap.remove(), 1700);
  }

  document.getElementById("newCard").addEventListener("click", () => {
    const hasMarks = state && state.marked.some((m, i) => m && i !== FREE);
    if (hasMarks && !confirm("Start a new card? Your current marks will be lost.")) return;
    newCard();
  });

  document.getElementById("clearMarks").addEventListener("click", () => {
    state.marked = state.marked.map((_, i) => i === FREE);
    save();
    render();
  });

  // ---------- Random item picker ----------
  const MONTHS = ["January", "February", "March", "April", "May", "June", "July",
    "August", "September", "October", "November", "December"];
  const pad2 = n => String(n).padStart(2, "0");
  const randDigit = () => String(Math.floor(Math.random() * 10));
  let picker = null; // { templates, literalX, from, to, last }

  function randomDate() {
    const t = picker.from + Math.random() * (picker.to - picker.from);
    const d = new Date(t);
    return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate() };
  }

  function fillTemplate(template) {
    let s = template;
    if (s.includes("YYYY")) {
      const { y, m, d } = randomDate();
      s = s.replace(/YYYYMMDD/g, `${y}${pad2(m)}${pad2(d)}`)
           .replace(/\bYYYY\b/g, String(y))
           .replace(/\bMM\b/g, pad2(m))
           .replace(/\bDD\b/g, pad2(d))
           .replace(/\bMonth\b/g, MONTHS[m - 1])
           .replace(/\bD\b/g, String(d));
    }
    // Protect words whose X is a real letter, fill every other X with a digit, then restore.
    const kept = [];
    for (const word of picker.literalX) {
      s = s.split(word).join(`\u0000${kept.length}\u0000`);
      kept.push(word);
    }
    s = s.replace(/X/g, randDigit);
    return s.replace(/\u0000(\d+)\u0000/g, (_, i) => kept[Number(i)]);
  }

  function newItem() {
    let template;
    do {
      template = picker.templates[Math.floor(Math.random() * picker.templates.length)];
    } while (picker.templates.length > 1 && template === picker.last);
    picker.last = template;
    document.getElementById("pickerTerm").textContent = fillTemplate(template);
    const fmt = document.getElementById("pickerFormat");
    fmt.textContent = "Format: ";
    const code = document.createElement("code");
    code.textContent = template;
    fmt.appendChild(code);
    document.getElementById("copyItem").textContent = "Copy";
  }

  async function copyItem() {
    const text = document.getElementById("pickerTerm").textContent;
    const btn = document.getElementById("copyItem");
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
    }
    btn.textContent = "Copied!";
  }

  async function initPicker() {
    try {
      const data = await (await fetch("/bingo/search-terms.json", { cache: "no-store" })).json();
      const templates = (data.templates || []).map(s => String(s).trim()).filter(Boolean);
      if (!templates.length) return;
      const range = data.dateRange || {};
      const from = Date.parse(range.from || "2005-01-01");
      const to = !range.to || range.to === "today" ? Date.now() : Date.parse(range.to);
      picker = { templates, literalX: data.literalX || [], from, to, last: null };
    } catch (e) {
      return; // no picker file: just hide the picker
    }
    document.getElementById("picker").hidden = false;
    document.getElementById("newItem").addEventListener("click", newItem);
    document.getElementById("copyItem").addEventListener("click", copyItem);
    newItem();
  }

  initPicker();

  (async function init() {
    try {
      const res = await fetch("/bingo/categories.json", { cache: "no-store" });
      const data = await res.json();
      categories = [...new Set((data.categories || []).map(s => String(s).trim()).filter(Boolean))];
    } catch (e) {
      gridEl.outerHTML = '<p class="error">Could not load categories.json. Open this page through the local server, not as a file.</p>';
      return;
    }
    if (categories.length < 24) {
      gridEl.outerHTML = `<p class="error">categories.json needs at least 24 categories (it has ${categories.length}).</p>`;
      return;
    }
    state = loadSaved() || null;
    if (state) render(); else newCard();
  })();
</script>
</body>
</html>
